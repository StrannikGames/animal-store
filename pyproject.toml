[project]
name = "animal-store"
version = "0.1.0"
description = "Учебный REST API магазина животных на FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[postgresql-asyncpg]>=2.0.48",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
]
